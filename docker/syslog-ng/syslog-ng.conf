@version: 4.8

# The syslog-ng collector for ./run.sh. At the Baseline the app sends nothing, so this
# records nothing; from Minimal SolidSyslog's records land in received_udp.log, which
# the run reads back. A single RFC 5424 UDP source writing to a file is all the
# run needs today; TCP/TLS/mTLS sources arrive with the tags that use them.

source s_udp {
    syslog(
        transport("udp")
        port(5514)
        keep-hostname(yes)
    );
};

destination d_file_udp {
    file(
        "/var/log/syslog-ng/received_udp.log"
        template("PRIORITY=${PRI} TIMESTAMP=${ISODATE} HOSTNAME=${HOST} APP_NAME=${PROGRAM} PROCID=${PID} MSGID=${MSGID} STRUCTURED_DATA=${SDATA} MSG=${MSG}\n")
        flush_lines(1)
        create-dirs(yes)
        perm(0644)
    );
};

log {
    source(s_udp);
    destination(d_file_udp);
};
