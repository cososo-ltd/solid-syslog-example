@version: 4.8

# The syslog-ng collector for ./run.sh. At the Baseline the app sends nothing, so this
# records nothing; from the first record on, SolidSyslog's records land in the
# received_*.log for their transport, which the run reads back. All four transports a
# device might use listen from the Baseline, so each stage has something to talk to the
# moment it needs it, and a broken listener is found by scripts/smoke-oracle.sh rather
# than by a stage failing several commits later.
#
# The certificates come from scripts/gen-certs.sh, regenerated on every run.

# --- UDP (RFC 5426) ----------------------------------------------------------

source s_udp {
    syslog(
        transport("udp")
        port(5514)
        keep-hostname(yes)
        # Keep the octets as they arrived. Without this ${RAWMSG} is empty and the
        # only view of a record is syslog-ng's interpretation of it.
        flags(store-raw-message)
    );
};

# --- TCP (RFC 6587 octet counting) -------------------------------------------

source s_tcp {
    syslog(
        transport("tcp")
        port(5601)
        keep-hostname(yes)
        flags(store-raw-message)
    );
};

# --- TLS, server authentication only (RFC 5425) ------------------------------
#
# peer-verify(no): no client certificate is requested. The device authenticates the
# collector and not the other way about, which is what the TLS stage does.

source s_tls {
    syslog(
        transport("tls")
        port(6514)
        keep-hostname(yes)
        flags(store-raw-message)
        tls(
            key-file("/certs/collector.key")
            cert-file("/certs/collector.crt")
            peer-verify(no)
        )
    );
};

# --- mTLS, on its own port ---------------------------------------------------
#
# A separate listener rather than peer-verify(optional-trusted) on 6514. Optional
# accepts a client that presents nothing, so it can prove a certificate is
# *validated* but never that one is *required* — a device that silently stopped
# presenting its own would still be accepted. required-trusted rejects it, which
# is what makes "this device authenticated" something the run demonstrates.

source s_mtls {
    syslog(
        transport("tls")
        port(6515)
        keep-hostname(yes)
        flags(store-raw-message)
        tls(
            key-file("/certs/collector.key")
            cert-file("/certs/collector.crt")
            ca-file("/certs/ca.crt")
            peer-verify(required-trusted)
        )
    );
};

# --- destinations ------------------------------------------------------------
#
# Two views of every record, and they answer different questions.
# wire   — the octets the device transmitted: what SolidSyslog emits, and
#          the only place a NILVALUE the device sent is visible as one.
# parsed — syslog-ng's reading of them: proof a real collector understood
#          the record. Fields the device left nil appear here filled in
#          with the collector's own substitutions, which is exactly why
#          the wire line has to be shown alongside it.

template t_record {
    template("wire   ${RAWMSG}\nparsed PRIORITY=${PRI} TIMESTAMP=${ISODATE} HOSTNAME=${HOST} APP_NAME=${PROGRAM} PROCID=${PID} MSGID=${MSGID} STRUCTURED_DATA=${SDATA} MSG=${MSG}\n");
};

# The smoke check's own records, kept off the device's view. Only the MSGID, which
# names the transport that carried it — the peer identity would be better still,
# but the ${.tls.x509_*} macros do not populate on a syslog() source in this build
# (verified against 4.8.2, with peer-verify both optional-trusted and
# required-trusted). Enforcement on 6515 is what proves the client certificate
# instead, and it is the stronger check anyway.
template t_smoke {
    template("${MSGID}\n");
};

filter f_smoke { program("oracle-smoke"); };

destination d_file_smoke {
    file("/var/log/syslog-ng/smoke.log" template(t_smoke) flush_lines(1) create-dirs(yes) perm(0644));
};

destination d_file_udp {
    file("/var/log/syslog-ng/received_udp.log" template(t_record) flush_lines(1) create-dirs(yes) perm(0644));
};

destination d_file_tcp {
    file("/var/log/syslog-ng/received_tcp.log" template(t_record) flush_lines(1) create-dirs(yes) perm(0644));
};

destination d_file_tls {
    file("/var/log/syslog-ng/received_tls.log" template(t_record) flush_lines(1) create-dirs(yes) perm(0644));
};

destination d_file_mtls {
    file("/var/log/syslog-ng/received_mtls.log" template(t_record) flush_lines(1) create-dirs(yes) perm(0644));
};

# Smoke records are taken off each source first — flags(final) stops them reaching
# the received_*.log the run reports as "what the device sent".
log { source(s_udp); source(s_tcp); source(s_tls); source(s_mtls); filter(f_smoke); destination(d_file_smoke); flags(final); };

log { source(s_udp);  destination(d_file_udp);  };
log { source(s_tcp);  destination(d_file_tcp);  };
log { source(s_tls);  destination(d_file_tls);  };
log { source(s_mtls); destination(d_file_mtls); };
