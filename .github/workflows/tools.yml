name: Tools

# Tests the scripts on this branch that rewrite a branch, against a scratch stack.
on:
  pull_request:
    paths:
      - scripts/**
      - .github/workflows/tools.yml

permissions:
  contents: read

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Test scripts/next.sh
        run: bash scripts/test-next.sh
