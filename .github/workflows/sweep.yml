name: Sweep

# Measures every stage of a release branch in one run, against one toolchain and
# one PKI, and keeps every stage's run report. See scripts/sweep.sh.
#
# Run by hand for a release, or started by solid-syslog's Example Sweep workflow
# with `library-changed` when a change lands on its main that could reach this
# stack. That writes wip/next again: the stages rebased onto a Baseline pinned at
# the commit named, on the container image that commit's own CI pins. It then
# sweeps wip/next as pushed and answers with `sweep-finished`. The stages are
# wip/next's own once it exists, so a stage fixed there by hand stays fixed; the
# first run takes them from the latest release branch. Where the image moves, the
# Baseline is run and its measurements/Baseline.csv captured again in the same
# commit. A stage that does not apply, or a Baseline that does not run, leaves
# wip/next as it was, and what is swept is the old wip/next with the pin and the
# image overridden.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to sweep (release/<version> or wip/<version>)
        required: true
      pin:
        description: A solid-syslog commit to sweep against in place of the one each stage pins
        required: false
      image:
        description: A container image to run every stage in, in place of the one the branch names
        required: false
  repository_dispatch:
    types: [library-changed]

run-name: Sweep ${{ inputs.ref || 'wip/next' }} at library ${{ inputs.pin || github.event.client_payload.sha || 'its pin' }}

permissions:
  contents: read

# Sweeps the chain starts supersede each other; a sweep run by hand is its own.
concurrency:
  group: sweep-${{ github.event_name == 'repository_dispatch' && 'library-changed' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'repository_dispatch' }}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PIN: ${{ inputs.pin || github.event.client_payload.sha }}
      IMAGE: ${{ inputs.image || github.event.client_payload.image }}
      SIBLING: ${{ github.event.repository.name == 'solid-syslog-example' && 'solid-syslog-example-make' || 'solid-syslog-example' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: tools
          persist-credentials: false

      # Every branch, because the chain names none: next.sh chooses the stages.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          path: stack
          fetch-depth: 0
          persist-credentials: false

      # wip/next is pushed with a token minted from the release GitHub App. The
      # stages carry a workflow of their own, and the job's token may not push a
      # commit that adds or changes one. No ruleset covers wip/next; release/**
      # and main are covered, so this token cannot rewrite either.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: github.event_name == 'repository_dispatch'
        id: push-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: cososo-ltd
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      # Twice at most: a fix pushed to wip/next while this ran loses the lease,
      # and the second attempt starts from that fix.
      - name: Rebase wip/next
        id: next
        if: github.event_name == 'repository_dispatch'
        working-directory: stack
        env:
          GH_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          # A lookup that fails must stop the step, not read as an empty answer.
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for _ in 1 2; do
            git fetch -q --prune "$remote" '+refs/heads/*:refs/remotes/origin/*'
            rc=0
            bash ../tools/scripts/next.sh "$PIN" "$IMAGE" > ../next.out || rc=$?
            cat ../next.out
            source=$(sed -n 's/^source=//p' ../next.out)
            was=$(sed -n 's/^was=//p' ../next.out)
            tip=$(sed -n 's/^tip=//p' ../next.out)
            # Exit 2 is also how awk and grep fail, so the stage has to be named.
            if [ "$rc" -eq 2 ] && grep -q '^conflict=' ../next.out; then
              sed -n '/^conflict=/p; /^commit=/p' ../next.out >> "$GITHUB_OUTPUT"
              echo "ref=$source" >> "$GITHUB_OUTPUT"
              echo "$(sed -n 's/^conflict=//p' ../next.out) does not apply; wip/next is left as it was"
              exit 0
            fi
            if [ "$rc" -eq 3 ] && grep -q '^capture=failed' ../next.out; then
              echo "capture=failed" >> "$GITHUB_OUTPUT"
              echo "ref=$source" >> "$GITHUB_OUTPUT"
              echo "the Baseline did not run; wip/next is left as it was"
              exit 0
            fi
            [ "$rc" -eq 0 ] || exit "$rc"
            # Seeded from a release branch, wip/next must not exist yet.
            expect=""
            [ "$source" != origin/wip/next ] || expect="$was"
            if git push -q "$remote" "--force-with-lease=refs/heads/wip/next:$expect" "$tip:refs/heads/wip/next"; then
              echo "ref=$tip" >> "$GITHUB_OUTPUT"
              echo "rebased=true" >> "$GITHUB_OUTPUT"
              baseline=$(sed -n 's/^baseline=//p' ../next.out)
              if [ -n "$baseline" ]; then
                echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
                echo "The Baseline was captured again: $baseline." >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "wip/next is $tip, from $source at $was"
              exit 0
            fi
            # Refused for the lease only if the branch is no longer where it was.
            now=$(git ls-remote "$remote" refs/heads/wip/next | cut -f1)
            [ "$now" != "$expect" ] || { echo "the push of wip/next was refused, and not because it moved" >&2; exit 1; }
            echo "wip/next moved during the rebase, to $now"
          done
          exit 1

      # Paired by slug with the sibling's wip/next, which need not be at the same
      # library commit: app/ does not depend on the pin. A sibling with no
      # wip/next yet is not compared; a comparison that cannot be made fails the
      # step, and the sweep still runs.
      - name: Compare app/ with the sibling stack
        id: invariant
        if: steps.next.outputs.rebased == 'true'
        working-directory: stack
        env:
          REF: ${{ steps.next.outputs.ref }}
        run: |
          sibling="https://github.com/cososo-ltd/${SIBLING}.git"
          rc=0
          git ls-remote --exit-code --heads "$sibling" refs/heads/wip/next > /dev/null || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "$SIBLING has no wip/next yet"
            exit 0
          fi
          [ "$rc" -eq 0 ] || { echo "cannot reach $SIBLING" >&2; exit 1; }
          git fetch -q "$sibling" '+refs/heads/wip/next:refs/sibling/wip/next'
          rc=0
          bash ../tools/scripts/app-invariant.sh "$REF" refs/sibling/wip/next > ../differing.out || rc=$?
          case "$rc" in
            0) echo "app/ is the same as $SIBLING's at every stage" ;;
            2) differing=$(paste -sd, - < ../differing.out)
               [ -n "$differing" ] || exit 1
               echo "differing=$differing" >> "$GITHUB_OUTPUT"
               echo "app/ differs from $SIBLING at: $differing" ;;
            *) exit 1 ;;
          esac

      # A rebased wip/next is swept as pushed: the pin and the image are its own.
      - name: Sweep
        id: sweep
        if: ${{ !cancelled() && steps.next.outcome != 'failure' }}
        working-directory: stack
        env:
          REF: ${{ steps.next.outputs.ref || 'HEAD' }}
          REBASED: ${{ steps.next.outputs.rebased }}
        run: |
          if [ "$REBASED" = true ]; then
            unset PIN IMAGE
          fi
          echo "sweeping $REF${PIN:+ at library $PIN}${IMAGE:+ in $IMAGE}"
          bash ../tools/scripts/sweep.sh "$REF" ../sweep-out

      - name: Publish figures to job summary
        if: always()
        run: |
          if [ -f sweep-out/figures.md ]; then
            cat sweep-out/figures.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sweep
          path: sweep-out/
          if-no-files-found: ignore

      # Answers the chain. The token is minted from the release GitHub App for
      # solid-syslog, where the App is installed; this repository holds only the
      # App's ID and key.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: always() && github.event_name == 'repository_dispatch'
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: cososo-ltd
          repositories: solid-syslog
          permission-contents: write

      # The run is green only where the rebase applied, the Baseline ran where it
      # had to, app/ matches the sibling and every stage passed: solid-syslog reads the last green run's title as
      # the last library commit this stack was good at.
      - name: Send sweep-finished to solid-syslog
        if: always() && github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEXT: ${{ steps.next.outcome }}
          SWEEP: ${{ steps.sweep.outcome }}
          REBASED: ${{ steps.next.outputs.rebased }}
          REF: ${{ steps.next.outputs.ref }}
          CONFLICT: ${{ steps.next.outputs.conflict }}
          CONFLICT_COMMIT: ${{ steps.next.outputs.commit }}
          CAPTURE: ${{ steps.next.outputs.capture }}
          BASELINE: ${{ steps.next.outputs.baseline }}
          INVARIANT: ${{ steps.invariant.outcome }}
          DIFFERING: ${{ steps.invariant.outputs.differing }}
        run: |
          # The comparison is skipped where nothing was rebased, and may only
          # pass or be skipped: an app/ never compared is not an app/ that matches.
          verdict=pass
          [ "$NEXT" = success ] && [ "$SWEEP" = success ] && [ "$INVARIANT" != failure ] \
            && [ -z "$CONFLICT" ] && [ -z "$CAPTURE" ] && [ -z "$DIFFERING" ] || verdict=fail
          [ "$REBASED" != true ] || REF=wip/next
          failed=""
          if [ -f sweep-out/stages.csv ]; then
            failed=$(awk -F, 'NR > 1 && $4 !~ /^"PASS/ { printf "%s%02d-%s", (n++ ? "," : ""), $1, $2 }' sweep-out/stages.csv)
          fi
          # A payload holds ten properties at most, so the rebase and the app/
          # comparison each travel as one.
          gh api repos/cososo-ltd/solid-syslog/dispatches \
            -f event_type=sweep-finished \
            -f "client_payload[stack]=${GITHUB_REPOSITORY#*/}" \
            -f "client_payload[sha]=$PIN" \
            -f "client_payload[ref]=${REF#origin/}" \
            -f "client_payload[verdict]=$verdict" \
            -f "client_payload[failed]=$failed" \
            -f "client_payload[rebase][outcome]=$NEXT" \
            -f "client_payload[rebase][conflict]=$CONFLICT" \
            -f "client_payload[rebase][commit]=$CONFLICT_COMMIT" \
            -f "client_payload[rebase][capture]=$CAPTURE" \
            -f "client_payload[rebase][baseline]=$BASELINE" \
            -f "client_payload[app][outcome]=$INVARIANT" \
            -f "client_payload[app][differing]=$DIFFERING" \
            -f "client_payload[run_url]=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "sweep-finished sent: $verdict${failed:+ ($failed)}${CONFLICT:+, $CONFLICT does not apply}${CAPTURE:+, the Baseline did not run}${DIFFERING:+, app/ differs at $DIFFERING}, app/ comparison $INVARIANT"
          [ "$verdict" = pass ]
