name: Sweep

# Measures every stage of a release branch in one run, against one toolchain and
# one PKI, and keeps every stage's run report. See scripts/sweep.sh.
#
# Run by hand for a release, or started by solid-syslog's Example Sweep workflow
# with `library-changed` when a change lands on its main that could reach this
# stack: that sweeps the latest release branch with the pin overridden to the
# commit named, in the container image that commit's own CI pins, commits
# nothing, and answers with `sweep-finished`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to sweep (release/<version> or wip/<version>)
        required: true
      pin:
        description: A solid-syslog commit to sweep against in place of the one each stage pins
        required: false
      image:
        description: A container image to run every stage in, in place of the one the branch names
        required: false
  repository_dispatch:
    types: [library-changed]

run-name: Sweep ${{ inputs.ref || 'latest release' }} at library ${{ inputs.pin || github.event.client_payload.sha || 'its pin' }}

permissions:
  contents: read

# Sweeps the chain starts supersede each other; a sweep run by hand is its own.
concurrency:
  group: sweep-${{ github.event_name == 'repository_dispatch' && 'library-changed' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'repository_dispatch' }}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PIN: ${{ inputs.pin || github.event.client_payload.sha }}
      IMAGE: ${{ inputs.image || github.event.client_payload.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: tools
          persist-credentials: false

      # The chain names no branch: it sweeps the newest release.
      - name: Choose the ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            REF=$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --paginate --jq '.[].name' \
                    | grep '^release/' | sort -V | tail -1)
            [ -n "$REF" ] || { echo "no release/ branch" >&2; exit 1; }
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sweeping $REF${PIN:+ at library $PIN}${IMAGE:+ in $IMAGE}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: stack
          fetch-depth: 0
          persist-credentials: false
      - name: Sweep
        id: sweep
        working-directory: stack
        run: bash ../tools/scripts/sweep.sh HEAD ../sweep-out

      - name: Publish figures to job summary
        if: always()
        run: |
          if [ -f sweep-out/figures.md ]; then
            cat sweep-out/figures.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sweep
          path: sweep-out/
          if-no-files-found: ignore

      # Answers the chain. The token is minted from the release GitHub App for
      # solid-syslog, where the App is installed; this repository holds only the
      # App's ID and key.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: always() && github.event_name == 'repository_dispatch'
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: cososo-ltd
          repositories: solid-syslog
          permission-contents: write

      - name: Send sweep-finished to solid-syslog
        if: always() && github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OUTCOME: ${{ steps.sweep.outcome }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          verdict=fail
          [ "$OUTCOME" = success ] && verdict=pass
          failed=""
          if [ -f sweep-out/stages.csv ]; then
            failed=$(awk -F, 'NR > 1 && $4 !~ /^"PASS/ { printf "%s%02d-%s", (n++ ? "," : ""), $1, $2 }' sweep-out/stages.csv)
          fi
          gh api repos/cososo-ltd/solid-syslog/dispatches \
            -f event_type=sweep-finished \
            -f "client_payload[stack]=${GITHUB_REPOSITORY#*/}" \
            -f "client_payload[sha]=$PIN" \
            -f "client_payload[ref]=$REF" \
            -f "client_payload[verdict]=$verdict" \
            -f "client_payload[failed]=$failed" \
            -f "client_payload[run_url]=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "sweep-finished sent: $verdict${failed:+ ($failed)}"
